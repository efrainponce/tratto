<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<title>Anuncio Tratto — prueba A/B</title>
<style>
  /* Lienzo fijo 1080×1350 (4:5). Se renderiza con Chrome headless: anuncio.html?v=a|b[&f=vertical|horizontal]
     Mismo estilo que la landing (landing/styles.css): Inter, verde profundo, gris mineral y salvia. */
  @font-face { font-family: Inter; src: url("../../landing/assets/inter-variable.woff2") format("woff2"); font-weight: 100 900; }
  :root { --bg: #e7ebed; --ink: #263b32; --muted: #58685f; --green: #305345; --sage: #dce5e0; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1350px; background: var(--bg); overflow: hidden; }
  body { font-family: Inter, sans-serif; color: var(--ink); display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; font-synthesis: none; }
  .icon { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

  .band { height: 144px; flex-shrink: 0; background: var(--green); color: #dfe8e1; display: flex; align-items: center; justify-content: space-between; padding: 0 88px; font-size: 26px; font-weight: 450; }
  .band img { height: 64px; }
  .logo-inline { display: none; height: 72px; align-self: flex-start; }

  main { flex: 1; display: flex; flex-direction: column; padding: 56px 88px 64px; }
  .eyebrow { display: flex; align-items: center; gap: 14px; font-size: 19px; font-weight: 550; letter-spacing: 3.4px; color: var(--green); }
  .eyebrow i { width: 11px; height: 11px; border-radius: 50%; background: #53785d; }
  h1 { margin-top: 24px; font-size: 90px; font-weight: 500; letter-spacing: -5.4px; line-height: 1.08; text-wrap: balance; }

  .chat { margin-top: auto; min-height: 0; background: var(--sage); border: 2px solid #d0dcd3; border-radius: 30px; overflow: hidden; }
  .chat-head { display: flex; align-items: center; gap: 20px; padding: 26px 40px; border-bottom: 2px solid #cbd9cf; }
  .chat-head .mark { width: 62px; height: 44px; color: var(--green); }
  .chat-head b { display: block; font-size: 28px; font-weight: 550; line-height: 1.3; }
  .chat-head small { font-size: 20px; color: var(--muted); }
  .chat-head .wa { width: 44px; height: 44px; margin-left: auto; color: #426b53; }
  .chat-body { padding: 34px 40px 40px; display: flex; flex-direction: column; gap: 24px; }
  .ask { align-self: flex-end; max-width: 90%; background: #c5dbcc; color: #2f4f3b; border-radius: 22px 4px 22px 22px; padding: 22px 28px 12px; font-size: 32px; line-height: 1.35; }
  .ask small, .answer > small { display: block; text-align: right; font-size: 16px; color: #47634d; margin-top: 6px; }
  .ask small span { color: #438e92; margin-left: 6px; }
  .answer { align-self: flex-start; width: 90%; background: #f3f7f1; color: #334b3b; border-radius: 4px 22px 22px 22px; padding: 30px 36px 14px; font-size: 28px; line-height: 1.4; }
  .answer strong { display: block; font-size: 80px; font-weight: 500; letter-spacing: -3.4px; line-height: 1.2; margin: 4px 0 6px; color: var(--ink); }
  .answer strong small { font-size: 28px; font-weight: 400; letter-spacing: 0; margin-left: 8px; }
  .source { display: flex; align-items: center; gap: 12px; margin-top: 24px; padding-top: 20px; border-top: 2px solid #e0e8dd; font-size: 19px; color: #617565; }
  .source .icon { width: 24px; height: 24px; }

  .cta { margin-top: 44px; font-size: 50px; font-weight: 500; letter-spacing: -2.2px; line-height: 1.1; }
  .cta span { color: var(--green); }

  /* ?f=vertical → 1080×1920 (Stories/Reels). Arriba ~270 px y abajo ~420 px los tapa la interfaz: ahí no va nada clave. */
  html.vertical, html.vertical body { height: 1920px; }
  html.vertical .band { display: none; }
  html.vertical main { padding: 290px 88px 430px; }
  html.vertical .logo-inline { display: block; margin-bottom: 44px; }
  html.vertical .eyebrow { display: none; }
  html.vertical h1 { margin: 0; font-size: 96px; }
  html.vertical .chat { margin-top: 60px; }

  /* ?f=horizontal → 1200×628 (1.91:1): pregunta a la izquierda, chat a la derecha. */
  html.horizontal, html.horizontal body { width: 1200px; height: 628px; }
  html.horizontal .band { height: 84px; padding: 0 56px; font-size: 18px; }
  html.horizontal .band img { height: 40px; }
  html.horizontal main { display: grid; grid-template-columns: 1fr 470px; grid-template-rows: auto 1fr auto; column-gap: 44px; padding: 36px 56px 40px; }
  html.horizontal .eyebrow { grid-area: 1 / 1; font-size: 13px; letter-spacing: 2.4px; gap: 10px; }
  html.horizontal .eyebrow i { width: 8px; height: 8px; }
  html.horizontal h1 { grid-area: 2 / 1; align-self: center; margin: 0; font-size: 60px; letter-spacing: -3.4px; }
  html.horizontal .cta { grid-area: 3 / 1; margin: 0; font-size: 30px; letter-spacing: -1.2px; }
  html.horizontal .chat { grid-column: 2; grid-row: 1 / span 3; align-self: center; margin: 0; border-radius: 18px; border-width: 1px; }
  html.horizontal .chat-head { padding: 14px 22px; gap: 12px; border-bottom-width: 1px; }
  html.horizontal .chat-head .mark { width: 38px; height: 27px; }
  html.horizontal .chat-head b { font-size: 17px; }
  html.horizontal .chat-head small { font-size: 12px; }
  html.horizontal .chat-head .wa { width: 26px; height: 26px; }
  html.horizontal .chat-body { padding: 18px 22px 22px; gap: 14px; }
  html.horizontal .ask { font-size: 18px; padding: 12px 16px 7px; border-radius: 13px 3px 13px 13px; }
  html.horizontal .ask small, html.horizontal .answer > small { font-size: 10px; margin-top: 3px; }
  html.horizontal .answer { font-size: 16px; padding: 18px 20px 8px; border-radius: 3px 13px 13px 13px; }
  html.horizontal .answer strong { font-size: 44px; letter-spacing: -1.8px; margin: 2px 0 3px; }
  html.horizontal .answer strong small { font-size: 16px; margin-left: 5px; }
  html.horizontal .source { font-size: 11px; gap: 7px; margin-top: 14px; padding-top: 11px; border-top-width: 1px; }
  html.horizontal .source .icon { width: 14px; height: 14px; }
</style>
</head>
<body>
  <header class="band"><img src="../../landing/assets/tratto-logo-light.svg" alt="Tratto"><span>usetratto.com</span></header>
  <main>
    <img class="logo-inline" src="../../landing/assets/tratto-logo.svg" alt="Tratto">
    <p class="eyebrow"><i></i>UN PORTAL A TU MEDIDA + WHATSAPP</p>
    <h1 id="q"></h1>
    <div class="chat">
      <div class="chat-head">
        <svg class="mark" viewBox="0 0 140 100" fill="currentColor" aria-hidden="true"><path d="M0 0h49c11 0 18 8 18 19v67c0 18-25 18-25 0V28H21C8 28 0 18 0 5Z"/><path d="M140 0H94c-11 0-18 8-18 19v40c0 18 25 18 25 0V28h18c13 0 21-10 21-23Z"/></svg>
        <div><b>Tratto</b><small>Tu asistente de negocio</small></div>
        <svg class="icon wa" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a9 9 0 0 1-9 9 10 10 0 0 1-4-.9L3 21l1.4-4.8A9 9 0 1 1 21 11.5Z"/><path d="m8 7 1.5 3-1 1c1 2 2 3 4 4l1-1 3 1.5c-.5 2-2 2.5-4 1.5-3-1.5-5-3.5-6-6-.7-2 0-3.5 1.5-4Z"/></svg>
      </div>
      <div class="chat-body">
        <div class="ask"><span id="pregunta"></span><small>10:42<span>✓✓</span></small></div>
        <div class="answer">
          <p id="intro"></p>
          <strong><span id="monto"></span><small>MXN</small></strong>
          <p id="detalle"></p>
          <div class="source"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>Con los datos de tu portal.</div>
          <small>10:42</small>
        </div>
      </div>
    </div>
    <p class="cta">Pregúntale a Tratto <span>por WhatsApp.</span></p>
  </main>
<script>
  // Cifras inventadas: nunca datos de un cliente real.
  var V = {
    a: {
      q: '¿Cuánto te deben hoy tus clientes?',
      pregunta: '¿Cuánto nos deben hoy?',
      intro: 'Hoy tienes por cobrar',
      monto: '$196,500',
      detalle: 'en 3 cuentas pendientes. La más grande es de $98,000.'
    },
    b: {
      q: '¿Cuánto cotizó tu empresa esta semana?',
      pregunta: '¿Cuánto cotizamos esta semana?',
      intro: 'Esta semana cotizaste',
      monto: '$3,760,200',
      detalle: 'en 14 cotizaciones. 5 siguen sin respuesta del cliente.'
    }
  };
  var params = new URLSearchParams(location.search);
  var v = V[params.get('v')] || V.a;
  if (/^(vertical|horizontal)$/.test(params.get('f'))) document.documentElement.classList.add(params.get('f'));
  ['q', 'pregunta', 'intro', 'monto', 'detalle'].forEach(function (id) { document.getElementById(id).textContent = v[id]; });
</script>
</body>
</html>
