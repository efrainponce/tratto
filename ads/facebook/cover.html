<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Portada de Facebook — Tratto</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@600&display=swap">
<style>
  /* 1640×924 (16:9). Móvil la muestra completa; escritorio recorta arriba y abajo y deja la franja
     central de 624 px (.band), así que todo el contenido vive ahí. La foto de perfil tapa la esquina
     inferior izquierda de la franja en escritorio: el texto termina antes. */
  :root {
    --bg: #f7f4ee; --ink: #2b2925; --ink-2: #726d61; --ink-3: #918b7c; --accent: #1f4d3f;
    --accent-soft: #e3ece6; --sunken: #efeae0; --border: #e2ded3;
    --wa-bg: #e9e4d6; --wa-in: #ffffff; --wa-out: #dcefd5;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1640px; height: 924px; overflow: hidden; background: var(--bg); }
  body { font-family: Inter, system-ui, sans-serif; color: var(--ink); position: relative; }
  .c1 { position: absolute; width: 760px; height: 760px; border-radius: 50%; background: var(--accent-soft); right: -170px; top: -260px; }
  .c2 { position: absolute; width: 560px; height: 560px; border-radius: 50%; background: var(--sunken); left: 520px; bottom: -380px; }
  .band { position: absolute; left: 0; right: 0; top: 150px; height: 624px; display: flex; align-items: center; justify-content: space-between; padding: 0 130px; gap: 60px; }
  .copy { max-width: 820px; margin-top: -60px; }
  .eyebrow { font: 600 21px/1 'JetBrains Mono', monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  h1 { font: 700 76px/1.06 'Familjen Grotesk', sans-serif; letter-spacing: -0.035em; margin-top: 26px; white-space: nowrap; }
  h1 em { font-style: normal; color: var(--accent); display: block; }
  .sub { font-size: 30px; line-height: 1.4; color: var(--ink-2); margin-top: 26px; }
  .sub b { color: var(--ink); font-weight: 600; }

  .chat { width: 500px; flex: none; background: var(--wa-bg); border: 1px solid var(--border); border-radius: 28px; padding: 26px;
          box-shadow: 0 2px 4px rgba(43,41,37,.05), 0 30px 70px -20px rgba(43,41,37,.28); display: flex; flex-direction: column; gap: 14px; }
  .head { display: flex; align-items: center; gap: 14px; padding-bottom: 16px; border-bottom: 1px solid rgba(43,41,37,.1); }
  .head i { width: 48px; height: 48px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font: 700 25px/1 'Familjen Grotesk', sans-serif; font-style: normal; }
  .head b { display: block; font-size: 22px; font-weight: 600; }
  .head small { font-size: 17px; color: var(--ink-3); }
  .b { max-width: 86%; padding: 14px 18px 10px; border-radius: 16px; font-size: 23px; line-height: 1.4; box-shadow: 0 1px 1px rgba(0,0,0,.06); }
  .b small { display: block; text-align: right; font-size: 14px; color: var(--ink-3); margin-top: 4px; }
  .b b { font-weight: 600; }
  .out { align-self: flex-end; background: var(--wa-out); border-top-right-radius: 5px; }
  .in { align-self: flex-start; background: var(--wa-in); border-top-left-radius: 5px; }
</style>
</head>
<body>
  <div class="c1"></div><div class="c2"></div>
  <div class="band">
    <div class="copy">
      <p class="eyebrow">Tu portal, hecho a mano</p>
      <h1>Pregúntale a tu empresa <em>por WhatsApp.</em></h1>
      <p class="sub">Cotiza, compra y cobra en un solo lugar.<br><b>Listo en 5 semanas.</b> usetratto.com</p>
    </div>
    <div class="chat">
      <div class="head"><i>T</i><div><b>Tratto</b><small>en línea</small></div></div>
      <div class="b out">¿Cuánto nos deben hoy?<small>9:41 ✓✓</small></div>
      <div class="b in"><b>$1,284,500</b> por cobrar. 3 cobros vencidos; el más grande es de <b>$412,000</b>.<small>9:41</small></div>
    </div>
  </div>
</body>
</html>
